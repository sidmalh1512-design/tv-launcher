<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avatar Q Launcher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  --screen:#0B0E14;--tile:#1F2430;--line:#323949;--fg:#E7EAF1;--muted:#99A1B3;--accent:#6E9DFF;--accent-ink:#A9C4FF;--shadow:#3A4252;
  --display:"Silkscreen","Courier New",monospace;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--screen);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
#tv{position:absolute;left:0;top:0;width:700px;height:394px;box-sizing:border-box;padding:18px 16px 16px;transform-origin:0 0}
#stage{position:absolute;left:16px;width:668px;bottom:16px;height:360px;transition:transform .7s ease-in-out}
.tile{position:absolute;height:200px;border-radius:14px;background:var(--tile) center/100% 100% no-repeat;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0;transition:transform .2s ease-out;cursor:pointer;transform-origin:50% 100%;box-sizing:border-box}
.tile.on{transform:scale(1.02);border:2px solid var(--accent)}
#hero{position:absolute;left:0;bottom:200px;width:36px;height:88px;z-index:2}
#rot{width:36px;height:88px;transform-origin:50% 64%}
#heroIn{width:36px;height:88px;transform-origin:50% 100%}
#heroIn.idle{animation:br 2.4s steps(2) infinite}
@keyframes br{50%{transform:scale(1.02,.985)}}
#heroIn svg{shape-rendering:crispEdges;display:block}
#shadow{position:absolute;left:4px;bottom:197px;width:28px;height:5px;border-radius:50%;background:var(--shadow);z-index:1}
#msg{position:absolute;left:0;right:0;top:6px;margin:0;text-align:center;color:var(--fg);font-size:14px;z-index:5;text-shadow:0 0 6px #000}
[hidden]{display:none!important}
#apps{position:absolute;left:0;top:0;width:700px;height:394px;box-sizing:border-box;padding:30px 60px 16px;background:var(--screen);z-index:4;display:flex;flex-direction:column}
#apps h1{margin:0 0 10px;font-size:20px;font-weight:600}
.searchbar{border:2px solid var(--line);border-radius:10px;background:var(--tile);padding:6px 12px;margin-bottom:10px}
.searchbar.on{border-color:var(--accent)}
#search{display:block;width:100%;box-sizing:border-box;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;font-size:15px}
#search::placeholder{color:var(--muted)}
#appNote{margin:0 0 6px;color:var(--muted);font-size:13px;min-height:20px}
#appList{flex:1;overflow:hidden}
.app{height:34px;line-height:30px;margin-bottom:4px;padding:0 12px;box-sizing:border-box;border:2px solid transparent;border-radius:8px;background:var(--tile);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app.on{border-color:var(--accent)}

    appsView.hidden = true;
    msg.textContent = '';
  }
  function appsKey(e) {
    var c = e.keyCode;
    if (document.activeElement === search) {
      // 65376 is Done and 65385 is Cancel on the TV's on-screen keyboard.
      if (c === 13 || c === 65376 || c === 65385 || c === 10009 || c === 27) {
        e.preventDefault();
        search.blur();
      }
      return;
    }
    if (c === 38 || c === 40) {
      e.preventDefault();
      appPos = Math.max(-1, Math.min(shown.length - 1, appPos + (c === 40 ? 1 : -1)));
      markApp();
    } else if (c === 13) {
      e.preventDefault();
      if (appPos < 0) search.focus();else if (shown[appPos]) {
        if (PREVIEW) msg.textContent = 'Preview: the TV would open ' + shown[appPos].name + '.';else {
          msg.textContent = 'Opening ' + shown[appPos].name + '…';
          launch([shown[appPos].name, '', [shown[appPos].id]]);
        }
      }
    } else if (c === 10009 || PREVIEW && c === 27) {
      e.preventDefault();
      closeApps();
    }
  }
  search.addEventListener('input', function () {
    appPos = -1;
    drawApps();
  });
  search.addEventListener('blur', markApp);
  // TizenBrew opens a module by navigating to it, so its own UI is the previous history entry.
  function exitToBrew() {
    if (PREVIEW) {
      msg.textContent = 'Preview: Back would return to TizenBrew.';
      return;
    }
    history.back();
  }
  // Samsung remotes report keyCode reliably; 10009 is Back, Escape and Backspace stand in for it in a browser.
  document.addEventListener('keydown', function (e) {
    if (appsOpen) {
      appsKey(e);
      return;
    }
    var c = e.keyCode,
      k = {
        37: [-1, 0],
        39: [1, 0],
        38: [0, -1],
        40: [0, 1]
      }[c];
    if (k) {
      e.preventDefault();
      go(k[0], k[1]);
    } else if (c === 13) {
      e.preventDefault();
      hop();
    } else if (c === 10009 || PREVIEW && (c === 27 || c === 8)) {
      e.preventDefault();
      exitToBrew();
    }
  });
  // The 700x394 design (stage plus its original padding) is scaled to fill the screen.
  function fit() {
    var s = Math.min(innerWidth / 700, innerHeight / 394),
      tv = document.getElementById('tv');
    tv.style.transform = 'translate(' + (innerWidth - 700 * s) / 2 + 'px,' + (innerHeight - 394 * s) / 2 + 'px) scale(' + s + ')';
  }
  fit();
  window.addEventListener('resize', function () {
    fit();
    place();
  });
  useInstalledApps(20);
  if (PREVIEW) msg.textContent = 'Preview: arrows move, Enter opens, Esc is Back.';
})();</script>
